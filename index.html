<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modular Medico — MCQ practice for MBBS students, organized by subject and module, with spaced repetition, OMR-style practice, and progress tracking." />
    <meta name="theme-color" content="#16121F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Modular Medico — MCQ Practice for MBBS Students</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
  (function () {
    var shown = false;
    function showError(msg) {
      if (shown) return;
      shown = true;
      var root = document.getElementById("root");
      var box = document.createElement("div");
      box.style.cssText = "font-family:monospace;white-space:pre-wrap;padding:16px;color:#fff;background:#7a1f1f;font-size:13px;line-height:1.5;";
      box.textContent = "App failed to start:\n\n" + msg;
      if (root) root.appendChild(box);
      else document.body.appendChild(box);
    }
    // After a new deploy, a device still holding the OLD app points at script files that no
    // longer exist. That is not a real crash: clear the stale cache and reload once, silently.
    var CHUNK_RE = /dynamically imported module|importing a module script|loading chunk|loading css chunk|unable to preload/i;
    function isChunkError(x) {
      var m = (x && (x.message || (x.reason && x.reason.message))) || String(x || "");
      return CHUNK_RE.test(m);
    }
    function recover() {
      try {
        var last = Number(sessionStorage.getItem("mm_chunk_reload") || 0);
        if (Date.now() - last < 60000) return false; // already tried a moment ago — show the error
        sessionStorage.setItem("mm_chunk_reload", String(Date.now()));
      } catch (e) {}
      var done = function () { location.reload(); };
      var work = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        work.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        work.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(work).then(done, done);
      return true;
    }
    window.addEventListener("vite:preloadError", function (e) {
      if (recover()) e.preventDefault();
    });
    window.addEventListener("error", function (e) {
      if (isChunkError(e.error || e) && recover()) return;
      showError((e.error && e.error.stack) || e.message || String(e));
    });
    window.addEventListener("unhandledrejection", function (e) {
      if (isChunkError(e) && recover()) { e.preventDefault(); return; }
      var r = e.reason;
      showError((r && r.stack) || (r && r.message) || String(r));
    });
    setTimeout(function () {
      if (!shown && document.getElementById("root") && !document.getElementById("root").hasChildNodes()) {
        showError("Nothing rendered after 4s and no JS error was caught.\nThis usually means the JS bundle failed to load (404) or a stale service worker is serving an old page.");
      }
    }, 4000);
  })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
